name: PhotoEditor CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python tests/ui_test.py
      - run: python tests/smoke_test.py
      - run: python tests/feature_test.py
      - run: python tests/batch_test.py
      - run: python tests/catalog_test.py
      - run: python tests/video_test.py
      - run: python tests/social_test.py
      - run: python -m compileall -q app core image masks processing presets social ui tests
  windows-build:
    runs-on: windows-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-build.txt
      - run: build_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoEditor-Windows
          path: dist/PhotoEditor-*.exe
