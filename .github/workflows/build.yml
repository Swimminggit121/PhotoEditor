name: PhotoEditor CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python tests/smoke_test.py
  windows-build:
    runs-on: windows-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm --clean --windowed --name PhotoEditor main.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoEditor-Windows
          path: dist/PhotoEditor/
