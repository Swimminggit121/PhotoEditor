name: PhotoEditor CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python tests/smoke_test.py
      - run: python tests/feature_test.py
      - run: python tests/batch_test.py
      - run: python tests/social_export_test.py
      - run: python tests/video_test.py
      - run: python -m compileall -q app core image masks presets processing tests ui video main.py video_main.py suite_main.py
  windows-build:
    runs-on: windows-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name PhotoEditor main.py
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name VideoEditor video_main.py
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name PhotoEditorSuite suite_main.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoEditor-Windows
          path: |
            dist/PhotoEditor.exe
            dist/VideoEditor.exe
            dist/PhotoEditorSuite.exe
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" "dist/PhotoEditor.exe" "dist/VideoEditor.exe" "dist/PhotoEditorSuite.exe" --title "PhotoEditor Suite $env:GITHUB_REF_NAME" --generate-notes
