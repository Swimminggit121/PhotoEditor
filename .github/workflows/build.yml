name: PhotoEditor CI

on:
  push:
    branches: [main, "release/*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python tests/smoke_test.py
      - run: python tests/feature_test.py
      - run: python -m pytest -q tests/batch_test.py
      - run: python tests/social_export_test.py
      - run: python tests/photo_intelligence_test.py
      - run: python tests/video_test.py
      - run: python -m compileall -q ai app core image masks presets processing tests ui video main.py video_main.py suite_main.py
      - run: python tests/ai_test.py

  windows-build:
    runs-on: windows-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name PhotoEditor main.py
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name VideoEditor video_main.py
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name PhotoEditorSuite suite_main.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoEditor-Windows
          path: |
            dist/PhotoEditor.exe
            dist/VideoEditor.exe
            dist/PhotoEditorSuite.exe

  windows-ai-build:
    runs-on: windows-latest
    needs: smoke-test
    if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install CPU PyTorch and DETR runtime
        run: |
          # CPU runtime keeps the consumer executable broadly compatible.
          # The runtime selects CUDA only in a separately configured CUDA-enabled environment.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers safetensors huggingface-hub
      - name: Verify model metadata and SafeTensors availability
        run: |
          python -c "from huggingface_hub import model_info; info = model_info('facebook/detr-resnet-50'); print('Model:', info.id); print('Revision:', info.sha); print('SafeTensors:', bool(info.safetensors))"
          python -c "from ai.config import MODEL_SPECS; assert MODEL_SPECS[0].model_id == 'facebook/detr-resnet-50'; assert MODEL_SPECS[0].weights_license.startswith('Apache-2.0')"
      - name: Install packager
        run: pip install pyinstaller
      - name: Build consumer AI executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PhotoEditor-AI --collect-all torch --collect-all torchvision --collect-all transformers --collect-all tokenizers --collect-all safetensors --collect-all huggingface_hub --collect-data cv2 main.py
      - name: Verify AI executable exists and size
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PhotoEditor-AI.exe")) { throw "PhotoEditor-AI.exe was not created" }
          $sizeBytes = (Get-Item "dist/PhotoEditor-AI.exe").Length
          $sizeMB = $sizeBytes / 1MB
          Write-Host ("PhotoEditor-AI.exe size: {0:N1} MB" -f $sizeMB)
          if ($sizeBytes -ge 1800MB) { throw "PhotoEditor-AI.exe is too large for a reliable GitHub release asset; reduce bundled dependencies." }
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoEditor-AI-Windows
          path: dist/PhotoEditor-AI.exe

  create-release:
    runs-on: windows-latest
    needs: [windows-build, windows-ai-build]
    if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PhotoEditor-Windows
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: PhotoEditor-AI-Windows
          path: release-assets
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -like "release/*") {
            $tag = "v" + $env:GITHUB_REF_NAME.Substring(8)
          } else {
            $tag = $env:GITHUB_REF_NAME
          }
          gh release view "$tag" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$tag" release-assets/PhotoEditor.exe release-assets/VideoEditor.exe release-assets/PhotoEditorSuite.exe release-assets/PhotoEditor-AI.exe --target "$env:GITHUB_SHA" --title "PhotoEditor Suite $tag" --generate-notes
          } else {
            gh release upload "$tag" release-assets/PhotoEditor.exe release-assets/VideoEditor.exe release-assets/PhotoEditorSuite.exe release-assets/PhotoEditor-AI.exe --clobber
          }
