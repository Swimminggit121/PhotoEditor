name: PhotoEditor CI

concurrency:
  group: photoeditor-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "release/*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python tests/smoke_test.py
      - run: python tests/feature_test.py
      - run: python -m pytest -q tests/batch_test.py
      - run: python tests/social_export_test.py
      - run: python tests/photo_intelligence_test.py
      - run: python tests/video_test.py
      - run: python -m compileall -q ai app core image masks presets processing tests ui video main.py video_main.py suite_main.py
      - run: python tests/ai_test.py

  windows-build:
    runs-on: windows-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name PhotoEditor main.py
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name VideoEditor video_main.py
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name PhotoEditorSuite suite_main.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoEditor-Windows
          path: |
            dist/PhotoEditor.exe
            dist/VideoEditor.exe
            dist/PhotoEditorSuite.exe

  windows-ai-build:
    runs-on: windows-latest
    needs: smoke-test
    if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install CUDA-capable PyTorch and DETR runtime
        run: |
          # Standard Windows PyTorch wheels include CUDA runtime libraries where supported.
          # The app uses CUDA when a compatible NVIDIA driver/GPU is present and falls back to CPU otherwise.
          pip install torch torchvision
          pip install transformers safetensors huggingface-hub
      - name: Verify CUDA-capable PyTorch and CPU fallback environment
        run: |
          python -c "import torch; print('PyTorch:', torch.__version__); print('CUDA runtime:', torch.version.cuda); print('CUDA available on runner:', torch.cuda.is_available()); assert torch.version.cuda is not None"
          python tests/ai_test.py
      - name: Verify model metadata and SafeTensors availability
        run: |
          python -c "from huggingface_hub import model_info; from ai.config import MODEL_SPECS; spec = MODEL_SPECS[0]; info = model_info(spec.model_id, revision=spec.revision); print('Model:', info.id); print('Pinned revision:', info.sha); print('SafeTensors:', bool(info.safetensors)); assert info.sha == spec.revision; assert bool(info.safetensors)"
          python -c "from ai.config import MODEL_SPECS; assert MODEL_SPECS[0].model_id == 'facebook/detr-resnet-50'; assert len(MODEL_SPECS[0].revision) == 40; assert MODEL_SPECS[0].weights_license.startswith('Apache-2.0')"
      - name: Verify pinned model weights by SHA-256
        run: |
          python -c "from huggingface_hub import hf_hub_download; from ai.config import MODEL_SPECS; import hashlib; spec=MODEL_SPECS[0]; path=hf_hub_download(repo_id=spec.model_id, filename='model.safetensors', revision=spec.revision); h=hashlib.sha256(); f=open(path, 'rb'); [h.update(chunk) for chunk in iter(lambda: f.read(1024*1024), b'')]; f.close(); actual=h.hexdigest(); print('SafeTensors SHA-256:', actual); assert actual.lower() == spec.weights_sha256.lower(), 'Model weight checksum mismatch'"
      - name: Install packager
        run: pip install pyinstaller
      - name: Build CUDA-capable AI application bundle (PyTorch DLLs included)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name PhotoEditor-AI --collect-all torch --collect-all torchvision --collect-all transformers --collect-all tokenizers --collect-all safetensors --collect-all huggingface_hub --collect-data cv2 main.py
      - name: Add third-party notices and dependency inventory
        shell: pwsh
        run: |
          pip install pip-licenses
          Copy-Item "THIRD_PARTY_NOTICES.md" "dist/PhotoEditor-AI/THIRD_PARTY_NOTICES.md"
          Copy-Item "AI_MODEL_MANIFEST.json" "dist/PhotoEditor-AI/AI_MODEL_MANIFEST.json"
          pip-licenses --format=json --output-file "dist/PhotoEditor-AI/third-party-licenses.json"
          if (!(Test-Path "dist/PhotoEditor-AI/third-party-licenses.json")) { throw "Dependency licence inventory was not generated" }
          if (!(Test-Path "dist/PhotoEditor-AI/AI_MODEL_MANIFEST.json")) { throw "AI model manifest was not packaged" }
      - name: Package and verify AI application bundle
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PhotoEditor-AI/PhotoEditor-AI.exe")) { throw "PhotoEditor-AI.exe was not created" }
          foreach ($required in @("THIRD_PARTY_NOTICES.md", "AI_MODEL_MANIFEST.json", "third-party-licenses.json")) {
            if (!(Test-Path ("dist/PhotoEditor-AI/" + $required))) { throw ("Required release file missing: " + $required) }
          }
          Compress-Archive -Path "dist/PhotoEditor-AI/*" -DestinationPath "dist/PhotoEditor-AI-Windows.zip" -CompressionLevel Optimal -Force
          $sizeBytes = (Get-Item "dist/PhotoEditor-AI-Windows.zip").Length
          $sizeMB = $sizeBytes / 1MB
          Write-Host ("PhotoEditor-AI-Windows.zip size: {0:N1} MB" -f $sizeMB)
          if ($sizeBytes -ge 1800MB) { throw "AI application bundle exceeds GitHub's reliable single-asset size limit." }
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoEditor-AI-Windows
          path: dist/PhotoEditor-AI-Windows.zip

  create-release:
    runs-on: windows-latest
    needs: [windows-build, windows-ai-build]
    # Keep public AI releases paused until model/data provenance and packaging checks are approved.
    if: startsWith(github.ref, 'refs/tags/v') && vars.ALLOW_AI_RELEASE == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PhotoEditor-Windows
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: PhotoEditor-AI-Windows
          path: release-assets
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -like "release/*") {
            $tag = "v" + $env:GITHUB_REF_NAME.Substring(8)
          } else {
            $tag = $env:GITHUB_REF_NAME
          }
          gh release view "$tag" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$tag" release-assets/PhotoEditor.exe release-assets/VideoEditor.exe release-assets/PhotoEditorSuite.exe release-assets/PhotoEditor-AI-Windows.zip --target "$env:GITHUB_SHA" --title "PhotoEditor Suite $tag" --generate-notes
          } else {
            gh release upload "$tag" release-assets/PhotoEditor.exe release-assets/VideoEditor.exe release-assets/PhotoEditorSuite.exe release-assets/PhotoEditor-AI-Windows.zip --clobber
          }
